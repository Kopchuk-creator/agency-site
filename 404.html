<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Агенція</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<script>
  /* Тема — до першого малювання, щоб темна не «блимала» білим */
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<script>
  // GitHub Pages віддає цю сторінку для будь-якої неіснуючої адреси на будь-якій глибині,
  // тому відносні шляхи тут не працюють. Визначаємо корінь сайту:
  // на github.io це /agency-site/, на власному домені — просто /.
  (function () {
    var first = location.pathname.split('/')[1];
    var root = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';

    // Старі адреси, які могли залишитись у закладках чи повідомленнях
    var moved = { posluhy: 'roboty/#tsiny', demo: 'zapys/', blog: '', keysy: 'roboty/#roboty' };
    var page = location.pathname.slice(root.length).split('/')[0];
    if (Object.prototype.hasOwnProperty.call(moved, page)) {
      location.replace(root + moved[page]);
      return;
    }

    var base = document.createElement('base');
    base.href = root;
    document.head.appendChild(base);
  })();
</script>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">

        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
